name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend (typecheck + migrations against real Postgres)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rehearse_io_test -p 5432:5432 postgres:18-alpine
          cd backend && bun install --frozen-lockfile && bunx tsc --noEmit && cd ..
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rehearse_io_test ./scripts/migrate

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          VITE_API_URL: https://api.rehearse.io.shrijit.tech

      - name: Validate AI service
        working-directory: ai-service
        run: |
          python -m compileall -q app
          pip install -q -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'app'); from main import app; assert app.title"

      - name: Validate compose config
        run: docker compose config
        env:
          JWT_SECRET: ci-placeholder
