# Rehearse.io API pipeline: test -> lint -> build (GHCR SHA) -> scan -> deploy prod.
# Adapted from templates/deploy-dynamic.yml.
# Required GitHub config:
#   secrets.DOPPLER_TOKEN        (repo) read-only service token, platform/prd
#   vars.DOKPLOY_URL             (org)
#   secrets.DOKPLOY_API_KEY      (repo) Dokploy API key (deploy trigger only)
#   vars.DOKPLOY_COMPOSE_ID      (repo) rehearse-api compose app id
#   vars.APP_URL                 (repo) https://api.rehearse.io.shrijit.tech
#   vars.INFISICAL_SECRET_PREFIX (repo) REHEARSE
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # Prose under backend/ must not trigger a prod deploy of identical code.
      - "!backend/**/*.md"
      # The Test job runs ./scripts/setup, which installs frontend deps too.
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/**"
      - "deploy/compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/**"
      - "deploy/compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names; `github.repository` preserves the
  # repo's capitalization, and Rehearse.io has capitals. Docker rejects the tag
  # with "repository name must be lowercase".
  IMAGE: ghcr.io/shrijit37/rehearse.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      # The smoke test authenticates against the shared auth service, so it
      # needs a verified account to sign in with. The credentials live in
      # Doppler `platform`/`prd` as REHEARSE_SMOKE_*; they are fetched into
      # `GITHUB_ENV`, and the Test step reads them through the env context.
      - uses: dopplerhq/cli-action@v4
      - name: Fetch shared-auth smoke credentials from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          for k in REHEARSE_SMOKE_EMAIL REHEARSE_SMOKE_PASSWORD; do
            val=$(doppler secrets get "$k" --plain --silent)
            [ -n "$val" ] || { echo "$k empty in Doppler" >&2; exit 1; }
            echo "::add-mask::$val"
            echo "$k=$val" >> "$GITHUB_ENV"
          done
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearse_io_test
          AUTH_URL: https://auth.shrijit.tech
          # The action writes to GITHUB_ENV, so read through the env context;
          # `secrets.*` stays empty for values that action injected.
          SMOKE_EMAIL: ${{ env.REHEARSE_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ env.REHEARSE_SMOKE_PASSWORD }}
          SMOKE_BASE_URL: http://127.0.0.1:9000
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rehearse_io_test -p 5432:5432 postgres:18-alpine
          ./scripts/setup
          ./scripts/migrate
          (cd backend && AUTH_RATE_MAX=100000 RATE_MAX=100000 bun src/server.ts) &
          for i in $(seq 1 30); do
            curl -fsS "$SMOKE_BASE_URL/health" >/dev/null && break
            sleep 1
          done
          ./scripts/test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # scripts/lint shells out to `npm run lint` in frontend/, so the deps have
      # to be installed first. Without this, eslint is simply not on PATH.
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: ./scripts/lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The deploy server is linux/arm64 (OCI Ampere). An amd64-only image is
      # rejected by Swarm with "no matching manifest for linux/arm64/v8", so
      # the task loop-fails and Traefik serves 502. Build both platforms.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (amd64+arm64, SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # APP_VERSION is baked into the image so GET /health reports the git
          # SHA as `version`, letting the gate tell new from stale containers.
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  scan:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v4
      - name: Fetch database URL from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          val=$(doppler secrets get REHEARSE_DATABASE_URL_EXTERNAL --plain --silent)
          [ -n "$val" ] || { echo "REHEARSE_DATABASE_URL_EXTERNAL empty in Doppler" >&2; exit 1; }
          echo "::add-mask::$val"
          echo "REHEARSE_DATABASE_URL_EXTERNAL=$val" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Run migrations
        # scripts/migrate needs DATABASE_URL and falls back to
        # DATABASE_URL_EXTERNAL for the actual connection, so hand it the
        # injected external URL. This step must fail loudly: prod 404s/500s
        # every authenticated route when its schema is missing, and a swallowed
        # error left the prod database with zero tables for a whole deploy.
        env:
          DATABASE_URL: ${{ env.REHEARSE_DATABASE_URL_EXTERNAL }}
        run: |
          # drizzle.config.ts imports drizzle-kit at runtime and bunx resolves it
          # from backend/node_modules, so install before migrating.
          (cd backend && bun install --frozen-lockfile)
          ./scripts/migrate
      - name: Point the Dokploy compose app at the SHA image and deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          IMAGE_REF: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # This Dokploy version serves its API under /api/<router>.<procedure>
          # (dot notation). The slashed form 404s, so a slash here silently
          # never deploys.
          #
          # Why compose and not application.redeploy: on this Dokploy build an
          # application cannot be image-sourced — redeploy runs a nixpacks build
          # ("Failed to read app source directory") and the old container keeps
          # answering. A raw compose app pulls the tag and rolls it.
          #
          # The deployed compose file lives in Dokploy's DB: send the repo copy
          # (deploy/compose.prod.yml) with the tag substituted. No registry
          # credentials are sent — the GHCR package is public, and a stored
          # token is exactly what poisoned pulls after it expired.
          jq -n --rawfile cf deploy/compose.prod.yml \
            --arg cid "$COMPOSE_ID" --arg img "$IMAGE_REF:$SHA" \
            '{composeId: $cid, composeFile: ($cf | gsub("__IMAGE__"; $img))}' > /tmp/compose.update.json
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/compose.update.json \
            "$DOKPLOY_URL/api/compose.update" > /dev/null
          jq -n --arg cid "$COMPOSE_ID" --arg t "CI $SHA" \
            '{composeId: $cid, title: $t}' > /tmp/compose.deploy.json
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/compose.deploy.json \
            "$DOKPLOY_URL/api/compose.deploy" > /dev/null
          echo "compose $COMPOSE_ID deployed with $IMAGE_REF:$SHA"
      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: ./scripts/health
