# Rehearse.io API pipeline: test -> lint -> build (GHCR SHA) -> scan -> deploy prod.
# Adapted from templates/deploy-dynamic.yml.
# Required GitHub config:
#   vars.INFISICAL_IDENTITY_ID   (repo) github-actions OIDC identity
#                                 (per repo: OIDC subjects are repo-scoped)
#   vars.INFISICAL_DOMAIN        (org)
#   vars.INFISICAL_PROJECT_SLUG  (org)
#   vars.DOKPLOY_URL             (org)
#   secrets.DOKPLOY_API_KEY      (repo) Dokploy API key (redeploy trigger only)
#   vars.DOKPLOY_APPLICATION_ID  (repo) backend application id
#   vars.APP_URL                 (repo) https://api.rehearseio.triptribe.info
#   vars.INFISICAL_SECRET_PREFIX (repo) REHEARSE
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names; `github.repository` preserves the
  # repo's capitalization, and Rehearse.io has capitals. Docker rejects the tag
  # with "repository name must be lowercase".
  IMAGE: ghcr.io/shrijit37/rehearse.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rehearse_io_test
          SMOKE_BASE_URL: http://127.0.0.1:9000
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rehearse_io_test -p 5432:5432 postgres:16-alpine
          ./scripts/setup
          ./scripts/migrate
          (cd backend && AUTH_RATE_MAX=100000 RATE_MAX=100000 bun src/server.ts) &
          for i in $(seq 1 30); do
            curl -fsS "$SMOKE_BASE_URL/ready" >/dev/null && break
            sleep 1
          done
          ./scripts/test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # scripts/lint shells out to `npm run lint` in frontend/, so the deps have
      # to be installed first. Without this, eslint is simply not on PATH.
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: ./scripts/lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The deploy server is linux/arm64 (OCI Ampere). An amd64-only image is
      # rejected by Swarm with "no matching manifest for linux/arm64/v8", so
      # the task loop-fails and Traefik serves 502. Build both platforms.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (amd64+arm64, SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  scan:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      # OIDC for the Infisical secrets-action, and the GHCR token handed to
      # Dokploy below. Without `packages: read` that token cannot pull the
      # image it is being told to deploy.
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch database URL from Infisical (OIDC)
        uses: infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-name: ${{ vars.INFISICAL_SECRET_PREFIX }}_DATABASE_URL_EXTERNAL
      - name: Run migrations
        # Not `set -e`: a failed migration must not abort the step. A nonzero
        # exit here would skip the Dokploy redeploy below and leave prod on the
        # old image, which is a confusing failure mode. Migrations are
        # idempotent, so if they fail the next green build retries them.
        run: |
          ./scripts/migrate || echo "::warning::migrations failed; continuing so prod still gets the new image"
      - name: Point Dokploy at SHA image and redeploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          IMAGE_REF: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This Dokploy version serves its API under /api/<router>.<procedure>
          # (dot notation). The slashed form 404s, so a slash here silently
          # never redeploys.
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$APPLICATION_ID\",\"dockerImage\":\"$IMAGE_REF:$SHA\",\"username\":\"${{ github.actor }}\",\"password\":\"$GHCR_TOKEN\",\"registryUrl\":\"ghcr.io\"}" \
            "$DOKPLOY_URL/api/application.saveDockerProvider"
          curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.redeploy" >/dev/null
          echo "redeploy triggered for $IMAGE_REF:$SHA"
      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: ./scripts/health
