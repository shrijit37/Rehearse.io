# Canonical fleet deploy workflow — GitHub Actions -> GHCR -> Coolify.
#
# This is the single source of truth for how a deployable fleet repo ships.
# It replaces the old Dokploy + Doppler pipeline:
#   - secrets: encrypted dotenvx files in the repo + DOTENV_PRIVATE_KEY_PRODUCTION
#     repo secret (replaces `dopplerhq/cli-action` + `doppler secrets get`)
#   - deploy: POST to the Coolify deploy webhook with a Deploy-scoped API token
#     (replaces Dokploy `application.saveDockerProvider` / `application.redeploy`)
#
# Reference: https://github.com/coollabsio/coolify-docs/blob/main/content/docs/applications/sources/github/actions.mdx
#
# Copy this file to <repo>/.github/workflows/deploy.yml and substitute the
# tokens marked REPLACE_ME. See ../README.md for the full runbook.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  # Required for vault-only / secret-rotation rollouts: with Doppler there was
  # no commit to re-run, so a rotated value could not be shipped (dayboard
  # DEPLOY.md "no workflow_dispatch" sharp edge). dotenvx fixes that: rotate
  # the private key secret and re-run.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/rehearse.io
  NODE_VERSION: "24"

jobs:
  test:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: make test

  lint:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: make lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Coolify's dockerimage application pulls :latest, so push both the
      # immutable SHA tag (audit / rollback) and the mutable tag Coolify reads.
      - name: Build and push (amd64+arm64, SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- dotenvx replaces Doppler -------------------------------------
      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx@^1

      - name: Decrypt production env
        # dotenvx decrypts .env.production IN PLACE using this private key.
        # The encrypted file is committed; the private key lives only in the
        # repo secret. No third-party secrets service at deploy time.
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          [ -f .env.production ] || { echo "encrypted .env.production missing" >&2; exit 1; }
          [ -n "$DOTENV_PRIVATE_KEY_PRODUCTION" ] || { echo "DOTENV_PRIVATE_KEY_PRODUCTION empty" >&2; exit 1; }
          dotenvx decrypt -f .env.production

      - name: Run migrations
        # dotenvx output is a plain .env.production after decrypt. Source it
        # for the migration client. Non-fatal by design (idempotent SQL).
        run: |
          set -a
          . ./.env.production
          set +a
          make migrate || echo "::warning::migrations failed; deploying anyway"

      # ---- Coolify deploy webhook replaces Dokploy API -------------------
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$COOLIFY_WEBHOOK" ] || { echo "COOLIFY_WEBHOOK empty" >&2; exit 1; }
          [ -n "$COOLIFY_TOKEN" ] || { echo "COOLIFY_TOKEN empty" >&2; exit 1; }
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Wait for healthy deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            body=$(curl -s --max-time 10 "$APP_URL/health" || echo '')
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"version\":\"$EXPECTED_VERSION\""; then
              echo "healthy at $EXPECTED_VERSION after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i/50: ${body:0:120}"
            sleep 6
          done
          echo "::error::$APP_URL/health never reached $EXPECTED_VERSION"
          exit 1
