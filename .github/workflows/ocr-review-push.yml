# OpenCodeReview — review direct pushes
#
# The `ocr-review.yml` workflow can only run on pull_request events: the
# composite action resolves a PR number and hard-fails without one
# (action.yml "Resolve PR refs"). A push carries no PR, so this workflow runs
# the OCR CLI directly and renders findings into the run summary instead of
# posting inline comments.
#
# Required repo secrets:
#   OCR_LLM_URL          — LLM endpoint base (OCR appends /chat/completions)
#   OCR_LLM_AUTH_TOKEN   — API key for the LLM endpoint
#
# The model is pinned inline. Change it here, not via a secret.
name: OCR Review (push)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - 'docs/**'
      - '**/package-lock.json'
      - '**/Cargo.lock'
      - '**/bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-review:
    name: Automated Code Review (push)
    runs-on: ubuntu-latest
    # Matches the PR workflow's cap; 15 minutes cut reviews off mid-run.
    timeout-minutes: 45
    steps:
      # Full history: OCR computes merge-base(from, to) and needs both ends.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install OpenCodeReview
        shell: bash
        run: |
          npm install -g --allow-scripts=@alibaba-group/open-code-review "@alibaba-group/open-code-review@1.13.0"
          ocr version

      - name: Configure OCR
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
        run: |
          # `enable_thinking` and `thinking` are rejected by the upstream for
          # cat-jam-free ("[unsupported_parameter] Unrecognized request
          # argument supplied"), and an unquoted value here is invalid JSON
          # anyway, which fails the step before any review runs.
          # `reasoning_effort` is accepted; keep it at 'low': reasoning_effort
          # max made the review loop itself the wall-clock bottleneck — a
          # 2-file PR measured 212 LLM turns, 4.2M input tokens, 34 min
          # (run 38959556324).
          ocr config set llm.extra_body '{"reasoning_effort": "low"}'
          ocr config set language 'English'

      - name: Review pushed range
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: cat-jam-free
          OCR_USE_ANTHROPIC: 'false'
          # Single-request budget in seconds (default 300): old max-effort
          # requests ran past 300s and the run failed with "LLM request
          # timeout ... context deadline exceeded".
          OCR_LLM_TIMEOUT: '900'
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Pass through to the summary renderer so it can label the range.
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          # A branch deletion reports after (github.sha) == 0000... and no
          # diff exists; exit green instead of failing union resolution.
          if [ "$HEAD_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch deleted; nothing to review."
            echo "OCR_EXIT_CODE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          # Base resolution for degraded events. A brand-new branch reports
          # before == 0000...; a force-push names a commit this checkout no
          # longer has. The OLD fallback reviewed from the ROOT commit, i.e.
          # the entire repository content (~140 reviewable files here) — a
          # measured 15-45 minute agent grind that upstream's own docs do not
          # recommend: for feature branches the recommended invocation is
          # `ocr review --from main` (Range Mode off the merge base), which
          # covers exactly the branch's delta from the default branch. The
          # PR pipeline reviews that same range anyway.
          degenerate() {
            # Empty or self-referential base is not reviewable as a delta.
            [ -z "$1" ] || [ "$1" = "$HEAD_SHA" ]
          }
          skip_review() {
            echo "No reviewable delta ($1); skipping review."
            echo "OCR_EXIT_CODE=0" >> "$GITHUB_ENV"
            exit 0
          }
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)"
            if degenerate "$BEFORE_SHA"; then
              skip_review "pushed the default branch as a new ref, or unrelated history"
            fi
            echo "New branch: reviewing the delta off $DEFAULT_BRANCH from $BEFORE_SHA"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # Force-push: review the rewritten tip's own commit.
            BEFORE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
            if degenerate "$BEFORE_SHA"; then
              BEFORE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)"
              if degenerate "$BEFORE_SHA"; then
                skip_review "orphan tip and no default-branch merge base"
              fi
              echo "Force-push with orphan tip: reviewing delta off $DEFAULT_BRANCH from $BEFORE_SHA"
            else
              echo "Force-push: previous tip is unreachable; reviewing from $BEFORE_SHA"
            fi
          fi
          echo "Reviewing $BEFORE_SHA..$HEAD_SHA"

          set +e
          # No `--audience agent`: the default human audience streams [ocr]
          # progress to stderr (OCR >= 1.9.8 keeps it out of the JSON stdout),
          # and the tee mirrors it into the run log live while the same bytes
          # land in /tmp/ocr-stderr.log for the artifact and the summary.
          # `--timeout` lifts the per-task budget off its 15-minute default,
          # under the job cap set above. `--max-tokens-budget` caps the run's
          # total token spend so a runaway review truncates at a predictable
          # ceiling instead of burning the 45-minute job budget: an
          # over-budget group gets one final round, remaining groups are
          # reported as failed(budget), partial results still publish, and
          # the run exits 0.
          OCR_STDERR_FIFO="$(mktemp -u)"
          mkfifo "$OCR_STDERR_FIFO"
          tee /tmp/ocr-stderr.log < "$OCR_STDERR_FIFO" >&2 &
          TEE_PID=$!
          ocr review \
            --from "$BEFORE_SHA" --to "$HEAD_SHA" \
            --effort low \
            --max-tokens-budget 3000000 \
            --format json --timeout 40 \
            > /tmp/ocr-result.json 2> "$OCR_STDERR_FIFO"
          OCR_EXIT=$?
          wait "$TEE_PID"
          rm -f "$OCR_STDERR_FIFO"
          set -e
          echo "OCR_EXIT_CODE=$OCR_EXIT" >> "$GITHUB_ENV"
          echo "=== OCR stderr ==="
          cat /tmp/ocr-stderr.log

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-push-result-${{ github.run_id }}
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: warn

      - name: Render findings to run summary
        if: always()
        shell: bash
        run: |
          node .github/scripts/render-ocr-summary.js /tmp/ocr-result.json >> "$GITHUB_STEP_SUMMARY" || {
            echo "OCR produced no parsable output (exit ${OCR_EXIT_CODE:-?})." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ocr-stderr.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Fail on OCR error
        if: env.OCR_EXIT_CODE != '0'
        shell: bash
        run: |
          echo "ocr review exited with code ${OCR_EXIT_CODE}; see artifacts."
          exit "${OCR_EXIT_CODE}"
