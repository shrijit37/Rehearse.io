# OpenCodeReview — Automated PR Review Pipeline
#
# Reviews every PR using Alibaba's OpenCodeReview (OCR) via the ccMesh
# gateway as the LLM backend. Posts inline comments and a sticky summary.
#
# Required repo secrets:
#   OCR_LLM_URL          — LLM endpoint (chat/completions)
#   OCR_LLM_AUTH_TOKEN   — API key for the LLM endpoint
#   OCR_LLM_MODEL        — Model to use for review (unused; the model is
#                          pinned inline to cat-jam-free below)
#
# The Action is an orchestrator: it installs the OCR CLI from npm at run
# time, so pinning only the Action ref does not freeze review behaviour.
# Both coordinates are pinned below — Action SHA + `ocr_version`.

name: OCR Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    # 15 minutes cancelled reviews mid-run (a review of PR #13 was killed at
    # 15m01s with no findings published). The per-task budget below stays under
    # this cap.
    timeout-minutes: 45
    steps:
      # No pre-checkout: the composite action checks out the PR *base* and
      # fetches head blobs from git objects, so untrusted PR files are never
      # materialised into the workspace with a credentialed remote.
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@1672852136fc87748249d22bce0819f33419ea79 # v1.13.0
        with:
          ocr_version: '1.13.0'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: cat-jam-free
          llm_use_anthropic: 'false'
          # `enable_thinking` is rejected upstream for cat-jam-free
          # ([unsupported_parameter] Unrecognized request argument supplied);
          # `reasoning_effort` is accepted — verified against the model
          # endpoint directly. 'low', not 'max': maximal reasoning on every
          # turn of the agent loop is why a 2-file PR took 34 min (212 LLM
          # turns, 4.2M input tokens — run 38959556324) and a 32-file PR blew
          # through this workflow's 45-minute cap.
          llm_extra_body: '{"reasoning_effort": "low"}'
          # CLI effort preset (needs OCR >= 1.10.0; we pin 1.13.0), matching
          # the push workflow's `--effort low`. Empty (default) would keep the
          # CLI's medium.
          effort: 'low'
          # Cap the agent loop's total token spend so a runaway review
          # truncates at a predictable ceiling instead of burning the whole
          # 45-minute job budget. An over-budget group gets one final round,
          # remaining groups are reported as failed(budget), and the run
          # still publishes partial results and exits 0.
          max_tokens_budget: '3000000'
          # Human-audience [ocr] progress lines stream live into the workflow
          # log (stderr) instead of appearing only after the run; the JSON
          # result still lands on stdout. Needs OCR >= 1.9.8; we pin 1.13.0.
          stream_progress: 'true'
          # Per-file task budget, in minutes (default 15). Raised with the job
          # cap so a long task is not dropped while the job still has time.
          review_task_timeout: '40'
          # Single-request budget, in seconds (default 300). Old max-effort
          # requests ran past 300s and failed with "LLM request timeout ...
          # context deadline exceeded", so they keep room inside the task
          # budget above even though low-effort requests should not need it.
          llm_timeout: '900'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: 'English'
          upload_artifacts: 'true'
