# Local development only. Production runs as a Dokploy application built from
# backend/Dockerfile (see platform.yaml) — not from this compose file.
#
# Postgres is NOT defined here: local dev uses the shared laptop Postgres and
# points DATABASE_URL at it. Create the database once with:
#   createdb rehearse_io_dev
services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: rehearse-ai-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GROQ_API_KEY
      - LITELLM_MODEL
      - STT_MODEL
      - STT_BACKEND=${STT_BACKEND:-local}
      - API_KEY=${AI_SERVICE_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - whisper_cache:/root/.cache/huggingface/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - rehearse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rehearse-backend
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres@host.docker.internal:5432/rehearse_io_dev}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=9000
      - APP_ENV=${APP_ENV:-development}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    extra_hosts:
      # Reach a Postgres running on the host from inside the container.
      - "host.docker.internal:host-gateway"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - rehearse-network

networks:
  rehearse-network:
    driver: bridge

volumes:
  whisper_cache:
